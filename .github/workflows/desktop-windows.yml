# Собирает «Воздушные барабаны» в готовую программу для Windows (AirDrums.exe),
# чтобы играть без установки Python. Готовый архив — на странице Releases (скачивается без входа в GitHub)
# и во вкладке Actions → этот запуск → Artifacts.
name: Air Drums — сборка для Windows

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: write   # выложить архив на страницу Releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pip-licenses

      - name: Модель рук MediaPipe
        run: curl -fsSL -o hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Сборка AirDrums.exe
        run: |
          python air_drums.py --write-ico air_drums.ico
          pyinstaller --noconfirm --windowed --name AirDrums --icon air_drums.ico \
            --add-data "hand_landmarker.task;." --add-data "samples;samples" --add-data "songs;songs" --collect-all mediapipe air_drums.py
          test -d dist/AirDrums/_internal/samples/rusty/kick
          test -f dist/AirDrums/_internal/songs/index.json
          test -f dist/AirDrums/_internal/songs/first_beat/backing.ogg

      - name: Лицензии рядом с игрой
        env:
          PYTHONUTF8: '1'   # в текстах лицензий есть не-латинские буквы, а консоль Windows — в cp1252
          PYTHONIOENCODING: utf-8
        run: |
          cp -r LICENSES dist/AirDrums/LICENSES
          cp "$(python -c 'import os, sys; print(os.path.join(sys.base_prefix, "LICENSE.txt"))')" dist/AirDrums/LICENSES/Python-PSF.txt
          pip-licenses --from=mixed --with-license-file --with-notice-file --no-license-path --format=plain-vertical \
            --ignore-packages pip-licenses prettytable wcwidth pyinstaller pyinstaller-hooks-contrib altgraph pefile \
              pywin32-ctypes setuptools pip \
            > dist/AirDrums/LICENSES/python-packages.txt
          test -s dist/AirDrums/LICENSES/python-packages.txt
          ls dist/AirDrums/LICENSES

      - name: Проверка запуска собранной программы
        run: |
          ./dist/AirDrums/AirDrums.exe --no-audio --camera missing.avi --quit-after 10 --stats stats.json
          cat stats.json
          grep -q '"model": "ready"' stats.json
          grep -q '"songs": 5' stats.json

      - uses: actions/upload-artifact@v4
        with:
          name: AirDrums-Windows
          path: desktop/dist/AirDrums

      - name: Архив на страницу Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/claude/air-drums-webcam-ai-rqbw9j' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(python -c "import re; print(re.search(r\"APP_VERSION = '([^']+)'\", open('air_drums.py', encoding='utf-8').read()).group(1))" | tr -d '\r')
          TAG="v$VER"
          (cd dist && 7z a -tzip -mx=5 ../AirDrums-Windows.zip AirDrums > /dev/null)
          ls -l AirDrums-Windows.zip
          cat > notes.md <<EOF
          Воздушные барабаны $VER для Windows 10/11.

          1. Скачайте **AirDrums-Windows.zip** ниже (раздел Assets).
          2. Распакуйте архив (правый клик → «Извлечь всё»).
          3. Откройте папку AirDrums и запустите **AirDrums.exe**. Если Windows покажет «Система Windows защитила ваш компьютер» — «Подробнее» → «Выполнить в любом случае».
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" AirDrums-Windows.zip --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" AirDrums-Windows.zip --target "$GITHUB_SHA" \
              --title "Air Drums $VER" --notes-file notes.md --latest
          fi
